import groovy.json.JsonOutput
import java.io.FileInputStream
import java.net.InetAddress
import java.net.URI
import java.security.KeyStore
import java.security.cert.CertificateFactory
import javax.net.ssl.HttpsURLConnection
import javax.net.ssl.SSLContext
import javax.net.ssl.TrustManagerFactory

plugins {
    id 'com.android.application'
}

// A verified HTTPS Next.js origin is part of the APK configuration, not a secret.
// Never replace this with the FastAPI URL or a static export fixture.
def siteUrl = providers.gradleProperty('vireadUrl')
    .orElse(providers.environmentVariable('VIREAD_FRONTEND_URL'))
    .getOrElse('')
    .trim()

// Explicit opt-in LAN acceptance mode (debug builds ONLY; release builds forbid it).
def lanModeRaw = providers.gradleProperty('vireadLanMode')
    .orElse(providers.environmentVariable('VIREAD_LAN_MODE'))
    .getOrElse('')
    .trim()
    .toLowerCase(java.util.Locale.ROOT)
def lanAcceptanceMode = ['1', 'true', 'yes', 'on'].contains(lanModeRaw)

def lanCaCertPath = providers.gradleProperty('vireadLanCaCert')
    .orElse(providers.environmentVariable('VIREAD_LAN_CA_CERT'))
    .getOrElse('')
    .trim()

def generatedLanResDir = layout.buildDirectory.dir('generated/lanAcceptanceRes').get().asFile

android {
    namespace 'vn.viread.android'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.viread.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'FRONTEND_URL', JsonOutput.toJson(siteUrl)
        buildConfigField 'boolean', 'LAN_ACCEPTANCE_MODE', lanAcceptanceMode ? 'true' : 'false'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testTmp = new File(gradle.gradleUserHomeDir, 'test-tmp')
            testTmp.mkdirs()
            systemProperty 'java.io.tmpdir', testTmp.absolutePath
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }

    if (lanAcceptanceMode) {
        sourceSets {
            debug {
                res.srcDir(generatedLanResDir)
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

def isPrivateLanIp = { String host ->
    if (!host || !host.matches(/[0-9]{1,3}(\.[0-9]{1,3}){3}/)) return false
    try {
        def addr = InetAddress.getByName(host)
        return addr.isSiteLocalAddress() && !addr.isLoopbackAddress()
    } catch (Exception ignored) {
        return false
    }
}

def validateLanCaFile = { ->
    if (!lanCaCertPath) {
        throw new GradleException('VIREAD_LAN_MODE=1 requires VIREAD_LAN_CA_CERT pointing to a public PEM CA certificate.')
    }
    def caFile = file(lanCaCertPath)
    if (!caFile.isFile()) {
        throw new GradleException('VIREAD_LAN_CA_CERT file not found: ' + caFile.absolutePath)
    }
    def text = caFile.getText('UTF-8')
    if (text.contains('PRIVATE KEY')) {
        throw new GradleException('Refusing to package a file containing a private key as VIREAD_LAN_CA_CERT.')
    }
    if (!text.contains('BEGIN CERTIFICATE')) {
        throw new GradleException('VIREAD_LAN_CA_CERT is not a valid PEM certificate.')
    }
    return caFile
}

tasks.register('prepareLanNetworkSecurityConfig') {
    group = 'verification'
    description = 'Generate scoped debug-only network_security_config.xml with the test LAN CA (never disables TLS or enables cleartext).'
    doLast {
        if (!lanAcceptanceMode) {
            if (generatedLanResDir.exists()) {
                generatedLanResDir.deleteDir()
            }
            return
        }
        def caFile = validateLanCaFile()
        def rawDir = new File(generatedLanResDir, 'raw')
        def xmlDir = new File(generatedLanResDir, 'xml')
        rawDir.mkdirs()
        xmlDir.mkdirs()
        new File(rawDir, 'viread_lan_ca.pem').setText(caFile.getText('UTF-8'), 'UTF-8')
        // Strictly cleartextTrafficPermitted="false"; adds only the local test CA alongside system roots.
        new File(xmlDir, 'network_security_config.xml').setText('''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="false">
        <trust-anchors>
            <certificates src="system" />
            <certificates src="@raw/viread_lan_ca" />
        </trust-anchors>
    </base-config>
</network-security-config>
''', 'UTF-8')
    }
}

tasks.register('verifyVireadFrontend') {
    group = 'verification'
    description = 'Refuse builds without a configured valid HTTPS Next.js origin.'
    doLast {
        if (!siteUrl) {
            throw new GradleException('VIREAD_FRONTEND_URL is required (HTTPS Next.js frontend). No placeholder APK will be built.')
        }
        URI uri
        try {
            uri = new URI(siteUrl)
        } catch (Exception ignored) {
            throw new GradleException('VIREAD_FRONTEND_URL is not a valid URL.')
        }
        def host = uri.host?.toLowerCase(java.util.Locale.ROOT)
        def hasValidBase = (uri.scheme == 'https' && host && uri.rawUserInfo == null &&
                uri.rawQuery == null && uri.rawFragment == null &&
                (uri.rawPath == '' || uri.rawPath == '/') && !host.contains(':'))

        if (lanAcceptanceMode) {
            validateLanCaFile()
            def validPort = (uri.port == -1 || (uri.port >= 1 && uri.port <= 65535))
            def validLanHost = isPrivateLanIp(host) || (host.contains('.') && !host.matches(/[0-9.]+/) && host != 'localhost' && !host.endsWith('.invalid'))
            if (!hasValidBase || !validPort || !validLanHost || host == 'localhost' || host == '127.0.0.1') {
                throw new GradleException('LAN acceptance VIREAD_FRONTEND_URL must be a private LAN HTTPS origin (never localhost/127.0.0.1 or HTTP).')
            }
        } else {
            if (!hasValidBase || !(uri.port == -1 || uri.port == 443) ||
                    host == 'localhost' || host.endsWith('.local') ||
                    host.endsWith('.invalid') || host.endsWith('.internal') ||
                    host.matches(/[0-9.]+/) || !host.contains('.')) {
                throw new GradleException('VIREAD_FRONTEND_URL must be a public HTTPS origin without a path, credentials, query or fragment.')
            }
        }
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('verifyVireadFrontend')
    dependsOn tasks.named('prepareLanNetworkSecurityConfig')
}

tasks.matching { it.name == 'preReleaseBuild' || it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    doFirst {
        if (lanAcceptanceMode) {
            throw new GradleException('LAN acceptance mode is strictly forbidden for release builds (assembleRelease / bundleRelease).')
        }
    }
}

/*
 * Never package a placeholder page even when Gradle is invoked directly.
 * Unit tests/lint may use a compile-only fixture URL; assemble must reach Next.js.
 */
tasks.register('verifyLiveFrontend') {
    group = 'verification'
    dependsOn tasks.named('verifyVireadFrontend')
    doLast {
        java.net.HttpURLConnection rootConnection = null
        java.net.HttpURLConnection loginConnection = null
        try {
            SSLContext lanSslContext = null
            if (lanAcceptanceMode) {
                def caFile = validateLanCaFile()
                def cf = CertificateFactory.getInstance('X.509')
                def cert = new FileInputStream(caFile).withCloseable { cf.generateCertificate(it) }
                def ks = KeyStore.getInstance(KeyStore.getDefaultType())
                ks.load(null, null)
                ks.setCertificateEntry('viread_lan_ca', cert)
                def tmf = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm())
                tmf.init(ks)
                lanSslContext = SSLContext.getInstance('TLS')
                lanSslContext.init(null, tmf.trustManagers, null)
            }

            def rootUrl = new URL(siteUrl.endsWith('/') ? siteUrl : siteUrl + '/')
            def loginUrl = new URL(rootUrl, 'login')
            def expectedPort = rootUrl.port == -1 ? 443 : rootUrl.port

            def nextHtml = { java.net.HttpURLConnection connection ->
                if (connection.responseCode != 200 ||
                        !(connection.contentType ?: '').toLowerCase(java.util.Locale.ROOT).contains('text/html')) {
                    throw new GradleException('The HTTPS frontend did not return HTML with HTTP 200.')
                }
                def html = connection.inputStream.withCloseable {
                    new String(it.readNBytes(300000), java.nio.charset.StandardCharsets.UTF_8)
                }
                def lower = html.toLowerCase(java.util.Locale.ROOT)
                if (lower.contains('viread project hub') || !lower.contains('<html') || !html.contains('/_next/') || !lower.contains('viread')) {
                    throw new GradleException('The HTTPS page is not a ViRead Next.js document.')
                }
            }
            def openNoRedirect = { URL url ->
                def connection = (java.net.HttpURLConnection) url.openConnection()
                if (lanSslContext != null && connection instanceof HttpsURLConnection) {
                    ((HttpsURLConnection) connection).setSSLSocketFactory(lanSslContext.socketFactory)
                }
                connection.connectTimeout = 18000
                connection.readTimeout = 18000
                connection.instanceFollowRedirects = false
                connection.setRequestProperty('User-Agent', 'ViRead-Android-Build/1.0')
                connection.setRequestProperty('Accept', 'text/html')
                return connection
            }

            rootConnection = openNoRedirect(rootUrl)
            def rootStatus = rootConnection.responseCode
            if ([301, 302, 303, 307, 308].contains(rootStatus)) {
                def location = rootConnection.getHeaderField('Location')
                if (!location) {
                    throw new GradleException('The HTTPS frontend root redirects without Location.')
                }
                def dest = rootUrl.toURI().resolve(location)
                def destHost = dest.host?.toLowerCase(java.util.Locale.ROOT)
                def destPort = dest.port == -1 ? 443 : dest.port
                if (dest.scheme != 'https' ||
                        destHost != rootUrl.host.toLowerCase(java.util.Locale.ROOT) ||
                        destPort != expectedPort ||
                        dest.rawUserInfo != null ||
                        dest.rawQuery != null || dest.rawFragment != null ||
                        !(dest.rawPath == '/login' || dest.rawPath == '/login/')) {
                    throw new GradleException('Frontend / must redirect only to same-origin /login.')
                }
            } else if (rootStatus == 200) {
                nextHtml(rootConnection)
            } else {
                throw new GradleException('Frontend / returned HTTP ' + rootStatus +
                        ', expected HTML or redirect to /login.')
            }

            loginConnection = openNoRedirect(loginUrl)
            if (loginConnection.responseCode != 200) {
                throw new GradleException('Frontend /login did not return HTTP 200.')
            }
            nextHtml(loginConnection)
        } catch (GradleException e) {
            throw e
        } catch (Exception e) {
            throw new GradleException('Could not validate the HTTPS ViRead Next.js frontend; no APK packaged.', e)
        } finally {
            rootConnection?.disconnect()
            loginConnection?.disconnect()
        }
    }
}

tasks.matching { it.name == 'assembleDebug' || it.name == 'assembleRelease' }.configureEach {
    dependsOn tasks.named('verifyLiveFrontend')
}
