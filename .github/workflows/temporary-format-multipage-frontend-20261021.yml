name: Temporary format fix for multi-page reading frontend
on:
  push:
    branches:
      - feature/multi-page-reading-range-20261021
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-page-reading-range-20261021
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Format changed frontend files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- frontend/ | sed 's#^frontend/##' | grep -E '\.(cjs|mjs|js|jsx|ts|tsx|json|css|scss|md|mdx|yaml|yml|html)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            printf '%s\n' "${files[@]}" | (cd frontend && xargs -r npx prettier --write --)
          fi
      - name: Commit and push formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "chore: format multi-page reading frontend changes"
          git push origin HEAD:feature/multi-page-reading-range-20261021
