name: Supabase Security Hardening (Disposable PostgreSQL)

# Do not filter paths: this check can be required for *every* PR into main.
# A path-filtered required workflow could remain indefinitely pending.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  supabase-security:
    name: Auth trigger, definer ACL, RLS and profile privilege regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: viread_security_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d viread_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: viread_security_ci

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install local PostgreSQL CLI
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version
          psql -X -v ON_ERROR_STOP=1 -c "select current_database(), current_setting('server_version')"

      - name: Exercise exact proposed migration in disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_disposable.sql

      - name: Destroy disposable test database
        if: always()
        run: |
          PGDATABASE=postgres psql -X -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS viread_security_ci WITH (FORCE)"
