name: Temporary Reading Management formatter

on:
  push:
    branches:
      - feature/reading-management-20261019

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'trancuong3/capstone1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reading-management-20261019
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format changed frontend files
        run: |
          npx prettier --write \
            "app/(app)/reading-management/page.tsx" \
            "components/books/book-card.tsx" \
            "components/books/book-library-screen.tsx" \
            "components/layout/app-shell.tsx" \
            "components/providers/app-services-provider.tsx" \
            "components/reading-management/reading-management-screen.tsx" \
            "hooks/use-reading-management-service.ts" \
            "lib/api/reading-management-service.ts" \
            "test/reading-management-service.test.ts" \
            "test/reading-management-ui.test.tsx" \
            "tests/books/book-library-screen.test.tsx" \
            "types/reading-management.ts"

      - name: Commit formatter output to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .
          if git diff --cached --quiet; then
            echo "All targeted files are already formatted."
            exit 0
          fi
          git commit -m "style: format reading management frontend"
          git push origin HEAD:refs/heads/feature/reading-management-20261019
