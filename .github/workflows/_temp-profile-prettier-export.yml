name: Temporary Profile Prettier Export

on:
  push:
    branches:
      - feature/parent-profile-contact-edit-20261018

permissions:
  contents: read

jobs:
  export-formatted-content:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format and export source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "components/profile/parent-profile-form.tsx"
            "components/profile/parent-profile-screen.tsx"
            "lib/api/profile-service.ts"
            "tests/auth/oauth-callback.test.ts"
            "tests/profile/parent-profile-screen.test.tsx"
            "types/profile.ts"
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            printf 'FMT_BEGIN|%s\n' "$file"
            base64 -w0 "$file" | fold -w 1800 | awk -v f="$file" 'BEGIN {n=0} {n++; printf "FMT_CHUNK|%s|%d|%s\n", f, n, $0}'
            printf 'FMT_END|%s\n' "$file"
          done
