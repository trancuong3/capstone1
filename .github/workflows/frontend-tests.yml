name: Frontend Checks

on:
  push:
    branches:
      - main
      - fix/retry-reading-controls
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend tests, typecheck, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure reliable Ubuntu APT sources
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
          sudo python3 -B .github/scripts/configure_ubuntu_apt.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Admin OCR lifecycle and atomic correction tests
        run: npm test -- tests/admin/admin-ocr-review-screen.test.tsx

      - name: Lint Admin OCR changes
        run: >-
          npx eslint
          components/admin/admin-ocr-review-screen.tsx
          lib/api/api-client.ts
          lib/api/ocr-review-service.ts
          lib/api/revision-service.ts
          tests/admin/admin-ocr-review-screen.test.tsx
          test/browser/real-data-fixture.ts
          test/browser/real-data.pw.ts

      - name: Run Admin OCR draft browser workflow
        run: >-
          npx playwright test
          --config=playwright.real-data.config.ts
          --grep "Admin OCR draft"

      - name: Run Parent CRUD and API client tests
        run: >-
          npm test --
          test/api-client.test.ts
          tests/admin/admin-parents-screen.test.tsx
          tests/admin/admin-parent-detail-screen.test.tsx

      - name: Run reading report and speech regression tests
        run: >-
          npm test --
          tests/reading/reading-screen.test.tsx
          tests/reading/retry-recognition.test.ts
          tests/reading/browser-transcript-collector.test.ts
          tests/reading/reading-report-page.test.tsx
          tests/reading/reading-async-cleanup.test.tsx
          test/speech-service.test.ts

      - name: ESLint for retry reading changes
        run: >-
          npx eslint
          components/reading/reading-screen.tsx
          components/reading/reading-layout.tsx
          components/reading/reading-controls.tsx
          lib/reading/retry-recognition.ts
          tests/reading/reading-screen.test.tsx
          tests/reading/retry-recognition.test.ts

      - name: Full frontend TypeScript check
        run: npx tsc --noEmit

      - name: Run realtime device permission and scanner navigation tests
        run: >-
          npm test --
          tests/reading/device-permission-service.test.ts
          tests/reading/device-permission-screen.test.tsx
          tests/reading/reading-preparation-screen.test.tsx
          tests/dashboard/dashboard-screen.test.tsx
          tests/books/book-detail-screen.test.tsx

      - name: ESLint for realtime device permission changes
        run: >-
          npx eslint
          components/reading/reading-preparation-screen.tsx
          components/reading/book-scanner-screen.tsx
          components/reading/camera-preview.tsx
          components/reading/reading-ready.tsx
          components/books/book-detail-screen.tsx
          components/dashboard/dashboard-screen.tsx
          lib/api/device-permission-service.ts
          types/reading.ts
          tests/reading/device-permission-service.test.ts
          tests/reading/device-permission-screen.test.tsx
          tests/reading/reading-preparation-screen.test.tsx
          tests/dashboard/dashboard-screen.test.tsx
          tests/books/book-detail-screen.test.tsx

      - name: TypeScript check for Parent CRUD source
        run: npx tsc --noEmit -p tsconfig.admin-parent-crud.json

      - name: ESLint for changed Parent CRUD source
        run: >-
          npx eslint
          components/admin/admin-parents-screen.tsx
          components/admin/admin-parent-detail-screen.tsx
          lib/api/admin-parent-service.ts
          lib/api/api-client.ts
          types/admin.ts
          "app/admin/(protected)/parents/page.tsx"
          "app/admin/(protected)/parents/[parentId]/page.tsx"

      # Informational until pre-existing whole-repository TypeScript debt is resolved.
      # Parent CRUD files are gated separately by scoped typecheck, lint and tests above.
      - name: Informational full-app production build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
