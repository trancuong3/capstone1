name: Frontend Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend tests, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API, Parent CRUD, OCR reading layout and Admin page service tests
        run: >-
          npm test --
          test/api-client.test.ts
          test/real-admin-services.test.ts
          tests/admin/admin-parents-screen.test.tsx
          tests/admin/admin-parent-detail-screen.test.tsx
          tests/reading/book-page-viewer.test.tsx

      - name: Check formatting for changed OCR and reading files
        run: >-
          npx prettier --check
          components/admin/admin-book-detail-screen.tsx
          components/admin/admin-page-uploader.tsx
          components/reading/book-page-viewer.tsx
          lib/api/admin-page-service.ts
          lib/api/reading-service.ts
          test/real-admin-services.test.ts
          tests/reading/book-page-viewer.test.tsx
          types/reading.ts

      - name: TypeScript check for Parent CRUD source
        run: npx tsc --noEmit -p tsconfig.admin-parent-crud.json

      - name: ESLint for changed Parent CRUD source
        run: >-
          npx eslint
          components/admin/admin-parents-screen.tsx
          components/admin/admin-parent-detail-screen.tsx
          lib/api/admin-parent-service.ts
          lib/api/api-client.ts
          types/admin.ts
          "app/admin/(protected)/parents/page.tsx"
          "app/admin/(protected)/parents/[parentId]/page.tsx"
          components/admin/admin-book-detail-screen.tsx
          components/admin/admin-page-uploader.tsx
          components/reading/book-page-viewer.tsx
          lib/api/admin-page-service.ts
          lib/api/reading-service.ts
          test/real-admin-services.test.ts
          tests/reading/book-page-viewer.test.tsx
          types/reading.ts

      # Informational until pre-existing whole-repository TypeScript debt is resolved.
      # Parent CRUD files are gated separately by scoped typecheck, lint and tests above.
      - name: Informational full-app production build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
