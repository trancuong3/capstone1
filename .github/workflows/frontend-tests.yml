name: Frontend Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend tests, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Parent CRUD and API client tests
        run: >-
          npm test --
          test/api-client.test.ts
          tests/admin/admin-parents-screen.test.tsx
          tests/admin/admin-parent-detail-screen.test.tsx

      - name: TypeScript check for Parent CRUD source
        run: npx tsc --noEmit -p tsconfig.admin-parent-crud.json

      - name: ESLint for changed Parent CRUD source
        run: >-
          npx eslint
          components/admin/admin-parents-screen.tsx
          components/admin/admin-parent-detail-screen.tsx
          lib/api/admin-parent-service.ts
          lib/api/api-client.ts
          types/admin.ts
          "app/admin/(protected)/parents/page.tsx"
          "app/admin/(protected)/parents/[parentId]/page.tsx"

      # Informational until pre-existing whole-repository TypeScript debt is resolved.
      # Parent CRUD files are gated separately by scoped typecheck, lint and tests above.
      - name: Informational full-app production build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
