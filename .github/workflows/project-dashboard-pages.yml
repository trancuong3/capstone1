name: Deploy ViRead Project Hub

on:
  pull_request:
    paths:
      - "project-dashboard/**"
      - ".github/workflows/project-dashboard-pages.yml"
  push:
    branches:
      - main
    paths:
      - "project-dashboard/**"
      - ".github/workflows/project-dashboard-pages.yml"
  issues:
    types: [opened, edited, reopened, closed, deleted]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate dashboard and snapshot code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("project-dashboard/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", source, re.IGNORECASE)
          if not match or '<html lang="vi"' not in source.lower():
              raise SystemExit("Invalid dashboard HTML or script")
          if ('localStorage' not in source or
              'hub-snapshot.json' not in source or
              'roadmap-core.js' not in source or
              'api.github.com' in source):
              raise SystemExit("Dashboard must use same-origin JSON without direct GitHub API calls")
          Path("/tmp/viread-project-dashboard.js").write_text(match.group(1), encoding="utf-8")
          print("Static dashboard source policy passed")
          PY
          node --check /tmp/viread-project-dashboard.js
          node --check project-dashboard/roadmap-core.js
          node --check project-dashboard/build-snapshot.cjs
          node --test project-dashboard/roadmap-core.test.cjs project-dashboard/dashboard-smoke.test.cjs project-dashboard/build-snapshot.test.cjs

  build:
    name: Build public static site
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create validated public JSON snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: node project-dashboard/build-snapshot.cjs

      - name: Stage only browser-safe assets
        run: |
          mkdir -p "$RUNNER_TEMP/viread-pages/data"
          cp project-dashboard/index.html project-dashboard/roadmap-core.js "$RUNNER_TEMP/viread-pages/"
          cp project-dashboard/data/hub-snapshot.json "$RUNNER_TEMP/viread-pages/data/hub-snapshot.json"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/viread-pages/data/hub-snapshot.json","utf8")); require("./project-dashboard/roadmap-core.js").validateSnapshot(p);'

      - name: Upload public static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/viread-pages

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
