name: Temporary Book Quality Prettier Artifact

on:
  push:
    branches:
      - feature/book-content-quality-reporting-20261107

permissions:
  contents: write

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Format only files introduced by the book quality feature
        run: |
          npx prettier --write \
            components/admin/admin-book-content-quality-screen.tsx \
            components/books/book-content-report-dialog.tsx \
            components/books/book-detail-screen.tsx \
            components/books/parent-book-reports-screen.tsx \
            lib/api/book-content-report-service.ts \
            lib/api/admin-book-content-quality-service.ts \
            types/book-content-quality.ts
        working-directory: frontend
      - name: Upload formatted source files
        uses: actions/upload-artifact@v4
        with:
          name: book-quality-prettier-formatted
          path: |
            frontend/components/admin/admin-book-content-quality-screen.tsx
            frontend/components/books/book-content-report-dialog.tsx
            frontend/components/books/book-detail-screen.tsx
            frontend/components/books/parent-book-reports-screen.tsx
            frontend/lib/api/book-content-report-service.ts
            frontend/lib/api/admin-book-content-quality-service.ts
            frontend/types/book-content-quality.ts
          retention-days: 1
      - name: Commit formatted feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/components/admin/admin-book-content-quality-screen.tsx \
            frontend/components/books/book-content-report-dialog.tsx \
            frontend/components/books/book-detail-screen.tsx \
            frontend/components/books/parent-book-reports-screen.tsx \
            frontend/lib/api/book-content-report-service.ts \
            frontend/lib/api/admin-book-content-quality-service.ts \
            frontend/types/book-content-quality.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format book content quality frontend"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
