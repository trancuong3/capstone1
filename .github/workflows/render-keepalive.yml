name: Render Backend Keep-Alive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-health:
    name: Keep Render backend warm
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping Render /health endpoint
        run: |
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 \
            "https://capstone1-ssd8.onrender.com/health" > /dev/null
          echo "Render backend is warm and healthy."

      - name: Trigger internal scheduled cron dispatch (all 8 workers)
        env:
          VIREAD_CRON_DISPATCH_TOKEN: ${{ secrets.VIREAD_CRON_DISPATCH_TOKEN }}
          PARENT_EMAIL_CRON_SECRET: ${{ secrets.PARENT_EMAIL_CRON_SECRET }}
        run: |
          if [ -z "$VIREAD_CRON_DISPATCH_TOKEN" ]; then
            if [ -n "$PARENT_EMAIL_CRON_SECRET" ]; then
              echo "::notice::VIREAD_CRON_DISPATCH_TOKEN not set; falling back to parent email cron dispatch (scheduled */30 * * * * dispatch runs via Cloudflare Cron)."
              curl -fsS --max-time 60 -X POST -H "Accept: application/json" -H "X-Cron-Secret: ${PARENT_EMAIL_CRON_SECRET}" "https://capstone1-ssd8.onrender.com/parent-notifications/cron/dispatch?scope=all" > /dev/null
              echo "Fallback parent email automation dispatch completed."
              exit 0
            fi
            echo "::notice::Neither VIREAD_CRON_DISPATCH_TOKEN nor PARENT_EMAIL_CRON_SECRET is set in GitHub Secrets; skipping manual cron dispatch (scheduled */30 * * * * dispatch runs via Cloudflare Cron)."
            exit 0
          fi
          curl -fsS --max-time 75 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-ViRead-Cron-Token: ${VIREAD_CRON_DISPATCH_TOKEN}" \
            "https://capstone1-ssd8.onrender.com/internal/cron/dispatch" > /dev/null
          echo "Internal scheduled cron dispatch completed."
