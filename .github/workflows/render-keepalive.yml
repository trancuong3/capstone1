name: Render Backend Keep-Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-health:
    name: Keep Render backend warm
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping Render /health endpoint
        run: |
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 \
            "https://capstone1-ssd8.onrender.com/health" > /dev/null
          echo "Render backend is warm and healthy."

      - name: Trigger internal scheduled cron dispatch (all 8 workers)
        env:
          VIREAD_CRON_DISPATCH_TOKEN: ${{ secrets.VIREAD_CRON_DISPATCH_TOKEN }}
        run: |
          if [ -z "$VIREAD_CRON_DISPATCH_TOKEN" ]; then
            echo "VIREAD_CRON_DISPATCH_TOKEN not set in GitHub Secrets; skipping internal cron dispatch."
            exit 0
          fi
          curl -fsS --max-time 75 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-ViRead-Cron-Token: ${VIREAD_CRON_DISPATCH_TOKEN}" \
            "https://capstone1-ssd8.onrender.com/internal/cron/dispatch" > /dev/null
          echo "Internal scheduled cron dispatch completed."

      - name: Trigger parent email automation dispatch (if secret configured)
        env:
          PARENT_EMAIL_CRON_SECRET: ${{ secrets.PARENT_EMAIL_CRON_SECRET }}
        run: |
          if [ -z "$PARENT_EMAIL_CRON_SECRET" ]; then
            echo "PARENT_EMAIL_CRON_SECRET not set in GitHub Secrets; skipping backup email dispatch."
            exit 0
          fi
          curl -fsS --max-time 75 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-Cron-Secret: ${PARENT_EMAIL_CRON_SECRET}" \
            "https://capstone1-ssd8.onrender.com/parent-notifications/cron/dispatch?scope=all" > /dev/null
          echo "Parent email automation dispatch completed."
