name: Repository Hygiene and Agent Configuration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Graphify cache and agent config integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify agent and skill lock configuration
        run: python3 -B scripts/validate_agent_config.py
      - name: Verify Git tracks only reproducible source and preserves agent config
        run: python3 -B scripts/verify_repository_hygiene.py
