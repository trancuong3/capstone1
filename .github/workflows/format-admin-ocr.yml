name: Format Admin Books OCR changed files

on:
  push:
    branches: [feature/admin-book-ocr-integration]
    paths:
      - "frontend/components/admin/admin-book-detail-screen.tsx"
      - "frontend/components/admin/admin-books-screen.tsx"
      - "frontend/components/admin/admin-new-book-screen.tsx"
      - "frontend/components/admin/admin-ocr-review-screen.tsx"
      - "frontend/components/admin/admin-page-uploader.tsx"
      - "frontend/lib/api/admin-book-service.ts"
      - "frontend/lib/api/admin-page-service.ts"
      - "frontend/lib/api/api-client.ts"
      - "frontend/lib/api/ocr-review-service.ts"
      - "frontend/lib/api/revision-service.ts"
      - "frontend/test/real-admin-services.test.ts"
      - "frontend/test/real-admin-ui.test.tsx"
      - "frontend/test/real-data-runtime-cleanup.test.tsx"
      - "frontend/tests/admin/admin-ocr-review-screen.test.tsx"
      - "frontend/tests/services/mock-admin-services.test.ts"
      - "frontend/types/admin.ts"

permissions:
  contents: write

jobs:
  format-feature-files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-book-ocr-integration
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format only the feature files
        run: |
          npx prettier --write \
            components/admin/admin-book-detail-screen.tsx \
            components/admin/admin-books-screen.tsx \
            components/admin/admin-new-book-screen.tsx \
            components/admin/admin-ocr-review-screen.tsx \
            components/admin/admin-page-uploader.tsx \
            lib/api/admin-book-service.ts \
            lib/api/admin-page-service.ts \
            lib/api/api-client.ts \
            lib/api/ocr-review-service.ts \
            lib/api/revision-service.ts \
            test/real-admin-services.test.ts \
            test/real-admin-ui.test.tsx \
            test/real-data-runtime-cleanup.test.tsx \
            tests/admin/admin-ocr-review-screen.test.tsx \
            tests/services/mock-admin-services.test.ts \
            types/admin.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git -C .. diff --quiet; then
            echo "Feature files already formatted."
            exit 0
          fi
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add frontend/components/admin/admin-book-detail-screen.tsx \
            frontend/components/admin/admin-books-screen.tsx \
            frontend/components/admin/admin-new-book-screen.tsx \
            frontend/components/admin/admin-ocr-review-screen.tsx \
            frontend/components/admin/admin-page-uploader.tsx \
            frontend/lib/api/admin-book-service.ts \
            frontend/lib/api/admin-page-service.ts \
            frontend/lib/api/api-client.ts \
            frontend/lib/api/ocr-review-service.ts \
            frontend/lib/api/revision-service.ts \
            frontend/test/real-admin-services.test.ts \
            frontend/test/real-admin-ui.test.tsx \
            frontend/test/real-data-runtime-cleanup.test.tsx \
            frontend/tests/admin/admin-ocr-review-screen.test.tsx \
            frontend/tests/services/mock-admin-services.test.ts \
            frontend/types/admin.ts
          git -C .. commit -m "style(admin-ocr): format OCR feature files"
          git -C .. push origin HEAD:feature/admin-book-ocr-integration
