name: Temporary OCR formatting preview
on:
  push:
    branches:
      - feature/hybrid-evidence-ocr-classification-20261109
    paths:
      - ".github/workflows/temporary-ocr-format-preview.yml"
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format screen and print only formatter diff
        run: |
          npx prettier --write components/admin/admin-ocr-review-screen.tsx
          git diff --no-ext-diff --unified=3 -- components/admin/admin-ocr-review-screen.tsx || true
