name: Temporary OCR three-color formatting and validation
# Short-lived helper to persist formatter output and validate the OCR PR branch.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/components/admin/admin-ocr-review-screen.tsx"
      - "frontend/tests/admin/admin-ocr-review-screen.test.tsx"
      - ".github/workflows/temporary-ocr-three-color-format.yml"

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Format changed OCR files
        run: npx prettier --write components/admin/admin-ocr-review-screen.tsx tests/admin/admin-ocr-review-screen.test.tsx
      - name: Verify repository formatting
        run: npm run format:check
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend type-check
        run: npm run typecheck
      - name: Run complete frontend tests
        run: npm test
      - name: Run production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Commit formatter output
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- frontend/components/admin/admin-ocr-review-screen.tsx frontend/tests/admin/admin-ocr-review-screen.test.tsx; then
            echo "Prettier made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/components/admin/admin-ocr-review-screen.tsx frontend/tests/admin/admin-ocr-review-screen.test.tsx
          git commit -m "style(ocr): format three-color review changes"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/trancuong3/capstone1.git" "HEAD:${GITHUB_HEAD_REF}"
