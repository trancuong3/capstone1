name: Temporary formatter for sequential reading hardening

on:
  push:
    branches:
      - fix/sequential-word-alignment-20261102
    paths:
      - ".github/workflows/format-sequential-reading-temp.yml"

permissions:
  contents: write

jobs:
  format-reading-files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/sequential-word-alignment-20261102
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Format sequential-reading hardening files
        run: |
          npx prettier --write \
            components/reading/reading-screen.tsx \
            hooks/use-speech-player.ts \
            tests/reading/reading-session-end-review.test.tsx
      - name: Commit formatting and remove this temporary workflow
        shell: bash
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/components/reading/reading-screen.tsx \
            frontend/hooks/use-speech-player.ts
          git add -f frontend/tests/reading/reading-session-end-review.test.tsx
          git rm .github/workflows/format-sequential-reading-temp.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were produced."
            exit 1
          fi
          git commit -m "style(reading): format session review hardening"
          git push origin HEAD:fix/sequential-word-alignment-20261102
