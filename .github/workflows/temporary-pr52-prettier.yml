name: Temporary PR52 Prettier Formatter

on:
  push:
    branches:
      - fix/reading-report-missing-transcript-20261102
    paths:
      - .github/workflows/temporary-pr52-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/reading-report-missing-transcript-20261102
          fetch-depth: 0

      - name: Set up the locked Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the exact locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Prettier version and format only the three failing files
        working-directory: frontend
        run: |
          npx prettier --version
          npx prettier --write \
            lib/api/api-client.ts \
            test/api-client.test.ts \
            test/speech-service.test.ts

      - name: Commit only actual formatter output to the same PR branch
        run: |
          git diff --check
          if git diff --quiet -- \
            frontend/lib/api/api-client.ts \
            frontend/test/api-client.test.ts \
            frontend/test/speech-service.test.ts; then
            echo "Prettier produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/lib/api/api-client.ts \
            frontend/test/api-client.test.ts \
            frontend/test/speech-service.test.ts
          git commit -m "style(frontend): apply locked Prettier formatting"
          git push origin HEAD:refs/heads/fix/reading-report-missing-transcript-20261102
