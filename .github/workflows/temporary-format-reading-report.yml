name: Temporary Prettier formatting helper for reading report test

on:
  push:
    branches:
      - fix/reading-report-missing-transcript-20261102
    paths:
      - frontend/tests/reading/reading-report-page.test.tsx
      - .github/workflows/temporary-format-reading-report.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reading-report-missing-transcript-20261102

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run the exact requested Prettier command
        run: npx prettier --write tests/reading/reading-report-page.test.tsx
        working-directory: frontend

      - name: Commit only formatter output to the existing branch
        shell: bash
        run: |
          if git diff --quiet -- frontend/tests/reading/reading-report-page.test.tsx; then
            echo "The file is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/reading/reading-report-page.test.tsx
          git commit -m "style: apply Prettier to reading report regression tests"
          git push origin HEAD:fix/reading-report-missing-transcript-20261102
