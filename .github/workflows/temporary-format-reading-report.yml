name: Temporary Prettier output capture for reading report test

on:
  push:
    branches:
      - fix/reading-report-missing-transcript-20261102
    paths:
      - frontend/tests/reading/reading-report-page.test.tsx
      - .github/workflows/temporary-format-reading-report.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reading-report-missing-transcript-20261102

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Apply and verify exact Prettier output
        shell: bash
        run: |
          npx prettier --write tests/reading/reading-report-page.test.tsx
          npx prettier --check tests/reading/reading-report-page.test.tsx
          echo "=== PRETTIER_REPORT_TEST_BEGIN ==="
          cat tests/reading/reading-report-page.test.tsx
          echo "=== PRETTIER_REPORT_TEST_END ==="
        working-directory: frontend
