name: Temporary format reading report branch

on:
  push:
    branches:
      - fix/reading-report-missing-transcript-20261102
    paths:
      - .github/workflows/temp-format-reading-report-20261102.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/reading-report-missing-transcript-20261102
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format only files changed by this PR
        working-directory: frontend
        run: >-
          npx prettier --write
          "app/sessions/[sessionId]/report/page.tsx"
          components/reading/reading-screen.tsx
          components/reading/session-complete.tsx
          lib/api/comparison-service.ts
          lib/api/speech-service.ts
          test/speech-service.test.ts
          tests/reading/browser-transcript-collector.test.ts
          tests/reading/reading-screen.test.tsx

      - name: Commit formatted files to the target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            "frontend/app/sessions/[sessionId]/report/page.tsx" \
            frontend/components/reading/reading-screen.tsx \
            frontend/components/reading/session-complete.tsx \
            frontend/lib/api/comparison-service.ts \
            frontend/lib/api/speech-service.ts \
            frontend/test/speech-service.test.ts \
            frontend/tests/reading/browser-transcript-collector.test.ts \
            frontend/tests/reading/reading-screen.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style(reading): format report and speech changes"
          git push origin HEAD:fix/reading-report-missing-transcript-20261102
