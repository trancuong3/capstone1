name: Temporary Prettier diagnostic

on:
  push:
    branches:
      - feature/vietnamese-ocr-confidence-no-child-page-save

permissions:
  contents: read

jobs:
  prettier-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Print canonical formatted PageMatchService test
        run: npx prettier test/real-page-match-service.test.ts
        working-directory: frontend
