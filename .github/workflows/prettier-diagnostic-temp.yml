name: Temporary Prettier diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Print formatter diff
        run: |
          for file in \
            components/admin/admin-parent-form-modal.tsx \
            components/admin/admin-parents-screen.tsx \
            tests/admin/admin-components.test.tsx \
            tests/admin/admin-parents-screen.test.tsx; do
            echo "===== $file ====="
            npx prettier "$file" > /tmp/prettier-output.tsx
            diff -u "$file" /tmp/prettier-output.tsx || true
          done
        working-directory: frontend
