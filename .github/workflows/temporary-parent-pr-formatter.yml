name: Temporary Parent PR formatter

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/temporary-parent-pr-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/parent-ux-polish-20261110'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format the exact PR frontend files
        run: |
          npx prettier --write \
            'app/(app)/reading-management/page.tsx' \
            'app/(app)/reports/difficult-words/page.tsx' \
            'app/(app)/reports/page.tsx' \
            'app/(app)/sessions/[sessionId]/page.tsx' \
            'app/(app)/sessions/page.tsx' \
            components/layout/app-shell.tsx \
            components/reading-management/reading-management-screen.tsx \
            components/reports/difficult-words-screen.tsx \
            components/reports/progress-report-filters.tsx \
            components/reports/progress-report-screen.tsx \
            components/reports/session-detail-screen.tsx \
            components/reports/session-history-item.tsx \
            components/reports/session-history-screen.tsx \
            lib/utils/progress-report-state.ts \
            test/fixtures/selected-child-test-provider.tsx \
            test/header-footer.test.tsx \
            test/reading-history-ui.test.tsx \
            test/reading-management-insights.test.tsx \
            test/reading-management-ui.test.tsx \
            test/reading-progress-services.test.ts \
            test/reading-progress-ui.test.tsx \
            test/real-parent-reports-ui.test.tsx \
            tests/reports/group5-components.test.tsx

          git add frontend
          if git diff --cached --quiet; then
            echo "All PR frontend files already use Prettier formatting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(parent): apply Prettier to PR files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
