name: Backend Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
          - 55439:5432
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      APP_ENVIRONMENT: test
      DATABASE_POOLER_MODE: local
      DATABASE_SSL_REQUIRED: "false"
      DATABASE_CONCURRENCY_LIMIT: "8"
      DATABASE_CONCURRENCY_WAIT_TIMEOUT: "5"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-publishable-key
      READING_REPORT_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
      ADMIN_OCR_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
      BOOK_CONTENT_QUALITY_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
      TESSERACT_CMD: /usr/bin/tesseract
      # Dedicated test-only databases; both test suites validate exact loopback ports/users.
      KARAOKE_TEST_DATABASE_URL: postgresql+asyncpg://karaoke_test:karaoke-test-password@127.0.0.1:55447/karaoke_phase2_test
      VIREAD_PHASE7_TEST_DATABASE_URL: postgresql+asyncpg://phase7:phase7-test-password@127.0.0.1:55439/viread_phase7_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure reliable Ubuntu APT sources
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
          sudo python3 -B .github/scripts/configure_ubuntu_apt.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR system dependencies
        run: |
          timeout 8m sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          timeout 8m sudo apt-get install -y --no-install-recommends libgl1 libgomp1 tesseract-ocr tesseract-ocr-vie postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify Tesseract
        run: |
          which tesseract
          tesseract --version
          tesseract --list-langs
          python -c "import pytesseract; print(pytesseract.__version__)"

      - name: Prepare disposable Karaoke and Phase 7 databases
        run: |
          # The PostgreSQL container is isolated from every Supabase/project database.
          PGPASSWORD=test psql -h 127.0.0.1 -p 5432 -U test -d test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE phase7 LOGIN PASSWORD 'phase7-test-password';
          CREATE ROLE karaoke_test SUPERUSER LOGIN PASSWORD 'karaoke-test-password';
          CREATE DATABASE viread_phase7_test OWNER phase7;
          CREATE DATABASE karaoke_phase2_test OWNER karaoke_test;
          SQL
          PGPASSWORD=phase7-test-password psql -h 127.0.0.1 -p 55439 -U phase7 -d viread_phase7_test -v ON_ERROR_STOP=1 -c 'SELECT 1'
          PGPASSWORD=karaoke-test-password psql -h 127.0.0.1 -p 55447 -U karaoke_test -d karaoke_phase2_test -v ON_ERROR_STOP=1 -c 'SELECT 1'

      - name: Prepare VietOCR V2 migration schema in disposable PostgreSQL
        working-directory: ${{ github.workspace }}
        run: python -B .github/scripts/prepare_viread_ocr_test_schema.py

      - name: Run backend unit, API and isolated PostgreSQL tests with skip audit
        run: python scripts/run_ci_tests.py

  real-ocr-quality:
    name: Real OCR model quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      VIREAD_REAL_OCR_GATE: "1"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-publishable-key
      TESSERACT_CMD: /usr/bin/tesseract
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Ubuntu APT sources
        working-directory: ${{ github.workspace }}
        run: sudo python3 -B .github/scripts/configure_ubuntu_apt.py
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Vietnamese OCR runtime
        run: |
          timeout 8m sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          timeout 8m sudo apt-get install -y --no-install-recommends libgl1 libgomp1 tesseract-ocr tesseract-ocr-vie
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Fail closed unless PaddleOCR, VietOCR and Vietnamese Tesseract pass real fixture gates
        timeout-minutes: 45
        run: python scripts/run_real_ocr_gate.py
