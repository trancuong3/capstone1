name: Backend Tests

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-publishable-key
      READING_REPORT_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
      TESSERACT_CMD: /usr/bin/tesseract

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y libgl1 libgomp1 tesseract-ocr tesseract-ocr-vie

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Run full backend unit and API test suite
        run: python -m unittest discover -v