name: Backend Tests

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      APP_ENVIRONMENT: test
      DATABASE_POOLER_MODE: local
      DATABASE_SSL_REQUIRED: "false"
      DATABASE_CONCURRENCY_LIMIT: "8"
      DATABASE_CONCURRENCY_WAIT_TIMEOUT: "5"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-publishable-key
      READING_REPORT_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
      TESSERACT_CMD: /usr/bin/tesseract

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR system dependencies
        run: |
          timeout 8m sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          timeout 8m sudo apt-get install -y --no-install-recommends libgl1 libgomp1 tesseract-ocr tesseract-ocr-vie

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify Tesseract
        run: |
          which tesseract
          tesseract --version
          tesseract --list-langs
          python -c "import pytesseract; print(pytesseract.__version__)"

      - name: Run full backend unit and API test suite
        run: python -m unittest discover -v
