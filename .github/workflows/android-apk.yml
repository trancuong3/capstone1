name: ViRead Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml", "frontend/**"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml", "frontend/**"]
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Deployed public HTTPS Next.js origin (e.g. https://viread.example.com)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  android-validation:
    name: Native Android JVM tests, compile and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify HTTPS frontend gate with offline unit tests
        run: python3 -m unittest discover -s android/scripts -p 'test_verify_frontend.py' -v
      - name: Verify APK quality and secret-audit script unit tests
        run: python3 -m unittest discover -s android/scripts -p 'test_verify_apk_quality.py' -v
      - name: Verify APK release staging script unit tests
        run: python3 -m unittest discover -s android/scripts -p 'test_stage_apk_release.py' -v
      - name: Run JVM tests, compile Android, and lint
        working-directory: android
        env:
          # Only compiled/tested; no APK is produced or uploaded with this test origin.
          VIREAD_FRONTEND_URL: https://example.org
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugJavaWithJavac :app:lintDebug

  android-apk:
    name: Verified server-backed debug APK
    needs: android-validation
    if: ${{ vars.VIREAD_FRONTEND_URL != '' || (github.event_name == 'workflow_dispatch' && inputs.frontend_url != '') }}
    runs-on: ubuntu-latest
    env:
      VIREAD_FRONTEND_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.frontend_url != '') && inputs.frontend_url || vars.VIREAD_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Refuse absent, fake, or inaccessible frontend
        run: python android/scripts/verify_frontend.py
      - name: Build unsigned-for-release debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify generated APK exists and passes quality/security/signature audit
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          python3 android/scripts/verify_apk_quality.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Generate SHA256SUMS.txt for debug APK artifact
        working-directory: android/app/build/outputs/apk/debug
        run: |
          sha256sum app-debug.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: viread-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
