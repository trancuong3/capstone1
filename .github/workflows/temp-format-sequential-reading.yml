name: Temporary Sequential Reading Formatter

on:
  push:
    branches:
      - fix/sequential-word-alignment-20261102

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/sequential-word-alignment-20261102

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format the sequential reading files
        working-directory: frontend
        run: >
          npx prettier --write
          components/reading/book-page-content.tsx
          components/reading/reading-screen.tsx
          lib/utils/sequential-reading-alignment.ts
          tests/reading/book-page-viewer.test.tsx
          tests/reading/sequential-reading-alignment.test.ts

      - name: Commit formatting changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             frontend/components/reading/book-page-content.tsx             frontend/components/reading/reading-screen.tsx             frontend/lib/utils/sequential-reading-alignment.ts             frontend/tests/reading/book-page-viewer.test.tsx             frontend/tests/reading/sequential-reading-alignment.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(reading): apply repository Prettier formatting"
            git push origin HEAD:fix/sequential-word-alignment-20261102
          else
            echo "Target files already match Prettier."
          fi
