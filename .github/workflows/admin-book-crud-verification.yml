name: Admin Book CRUD Verification

on:
  push:
    branches:
      - feature/admin-book-crud-metadata-quality-20261020
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-verification:
    name: Frontend format, lint, typecheck, tests, build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format frontend files touched by Admin Book CRUD
        run: |
          npx prettier --write \
            "app/admin/(protected)/books/[bookId]/edit/page.tsx" \
            components/admin/admin-book-detail-screen.tsx \
            components/admin/admin-book-editor-screen.tsx \
            components/admin/admin-books-screen.tsx \
            components/admin/admin-metadata-quality-screen.tsx \
            lib/api/admin-book-service.ts \
            tests/admin/admin-book-editor-screen.test.tsx \
            tests/admin/admin-metadata-quality-screen.test.tsx

      - name: Commit scoped formatting if required
        working-directory: .
        run: |
          git add -f -- \
            "frontend/app/admin/(protected)/books/[bookId]/edit/page.tsx" \
            frontend/components/admin/admin-book-detail-screen.tsx \
            frontend/components/admin/admin-book-editor-screen.tsx \
            frontend/components/admin/admin-books-screen.tsx \
            frontend/components/admin/admin-metadata-quality-screen.tsx \
            frontend/lib/api/admin-book-service.ts \
            frontend/tests/admin/admin-book-editor-screen.test.tsx \
            frontend/tests/admin/admin-metadata-quality-screen.test.tsx
          if git diff --cached --quiet; then
            echo "Scoped frontend formatting is already clean."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style: format admin book CRUD frontend files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check formatting of feature files
        run: |
          npx prettier --check \
            "app/admin/(protected)/books/[bookId]/edit/page.tsx" \
            components/admin/admin-book-detail-screen.tsx \
            components/admin/admin-book-editor-screen.tsx \
            components/admin/admin-books-screen.tsx \
            components/admin/admin-metadata-quality-screen.tsx \
            lib/api/admin-book-service.ts \
            tests/admin/admin-book-editor-screen.test.tsx \
            tests/admin/admin-metadata-quality-screen.test.tsx

      - name: Check whole-repository formatting
        continue-on-error: true
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
